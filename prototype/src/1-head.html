<title>Framecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Montserrat:wght@400;500;700;900&family=Figtree:wght@400;500;700;800&family=Fredoka:wght@600&family=Luckiest+Guy&family=Bangers&family=Press+Start+2P&family=Oswald:wght@400;700&family=Nunito:wght@400;700&family=Permanent+Marker&family=Roboto:wght@400;700&family=Roboto+Mono:wght@400;700&family=Ubuntu:wght@400;700&family=Merriweather:wght@400;700&family=Arimo:wght@400;700&display=swap">
<style>
/* Layout: Studio-style editor. App bar and insert ribbon on top; Explorer left, device viewport center, Properties right, as floating panels on a cool graphite ground. Scale values are teal, Offset values amber, everywhere. */
:root {
  --bg: #E8EBF1;
  --panel: #F7F8FB;
  --raised: #FFFFFF;
  --line: #D2D7E1;
  --line-soft: #E4E7EE;
  --fg: #171B29;
  --muted: #586075;
  --faint: #868EA3;
  --accent: #2C4FD8;
  --accent-soft: rgba(44, 79, 216, 0.12);
  --on-accent: #FFFFFF;
  --scale: #0A8276;
  --offset: #AE5F08;
  --guide: #DB2F89;
  --danger: #C2362B;
  --stage: #D8DCE5;
  --stage-dot: rgba(23, 27, 41, 0.14);
  --shadow: 0 1px 2px rgba(20, 24, 40, 0.06), 0 6px 20px rgba(20, 24, 40, 0.07);
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101217; --panel: #171A21; --raised: #1E222B; --line: #2B303C; --line-soft: #232731;
    --fg: #E4E7EE; --muted: #9AA1B3; --faint: #6D7487; --accent: #7189FF; --accent-soft: rgba(113, 137, 255, 0.16);
    --on-accent: #0D1020; --scale: #3FC6B6; --offset: #F2A54A; --guide: #FF5CAD; --danger: #FF6B5E;
    --stage: #0B0D11; --stage-dot: rgba(228, 231, 238, 0.09);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101217; --panel: #171A21; --raised: #1E222B; --line: #2B303C; --line-soft: #232731;
  --fg: #E4E7EE; --muted: #9AA1B3; --faint: #6D7487; --accent: #7189FF; --accent-soft: rgba(113, 137, 255, 0.16);
  --on-accent: #0D1020; --scale: #3FC6B6; --offset: #F2A54A; --guide: #FF5CAD; --danger: #FF6B5E;
  --stage: #0B0D11; --stage-dot: rgba(228, 231, 238, 0.09);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.4 var(--font-ui);
  overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- shell ---------- */
.app {
  height: 100%;
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr) 332px;
  grid-template-rows: auto auto minmax(0, 1fr);
  grid-template-areas: "bar bar bar" "ribbon ribbon ribbon" "explorer stage props";
  gap: 8px;
  padding-block: 10px;
  padding-inline: 16px;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* app bar */
.bar { grid-area: bar; display: flex; align-items: center; gap: 12px; min-width: 0; }
.wordmark { display: flex; align-items: center; gap: 9px; flex: none; }
.wordmark svg { width: 26px; height: 26px; flex: none; }
.wordmark b { font: 700 19px/1 var(--font-display); letter-spacing: -0.01em; }
.chip {
  font: 600 10px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 4px 7px;
}
.bar .spacer { flex: 1; }
.bar .group { display: flex; gap: 4px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
  border-radius: 7px; border: 1px solid var(--line); background: var(--raised); color: var(--fg);
  font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--faint); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.icon { width: 30px; padding: 0; justify-content: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.narrow-only { display: none !important; }

/* ribbon */
.ribbon {
  grid-area: ribbon; display: flex; flex-direction: row; gap: 6px; align-items: stretch;
  overflow-x: auto; scrollbar-width: thin; padding: 6px 8px;
}
.rgroup { display: flex; flex-direction: column; gap: 3px; padding-inline: 4px; flex: none; }
.rgroup + .rgroup { border-left: 1px solid var(--line-soft); padding-left: 10px; }
.rgroup .items { display: flex; gap: 2px; align-items: center; flex: 1; }
.rgroup .label { font-size: 10.5px; color: var(--faint); text-align: center; letter-spacing: 0.04em; }
.tool {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-width: 58px; height: 50px; padding: 4px 6px; border-radius: 7px; border: 1px solid transparent;
  background: none; font-size: 11px; color: var(--fg); white-space: nowrap;
}
.tool:hover { background: var(--accent-soft); }
.tool:disabled { opacity: 0.38; background: none; cursor: default; }
.tool svg { width: 20px; height: 20px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--raised); }
.seg button { border: 0; background: none; height: 28px; padding: 0 10px; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.stack { display: flex; flex-direction: column; gap: 5px; justify-content: center; flex: 1; }

/* panel headers */
.phead {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px;
  border-bottom: 1px solid var(--line-soft); min-height: 40px;
}
.phead h2 { margin: 0; font: 600 11px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.phead .spacer { flex: 1; }
.pbody { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; }

/* explorer */
.explorer { grid-area: explorer; }
.tree { padding: 6px 4px 16px; user-select: none; }
.row {
  display: flex; align-items: center; gap: 4px; height: 26px; padding-right: 6px;
  border-radius: 6px; cursor: default; position: relative; white-space: nowrap;
}
.row:hover { background: var(--line-soft); }
.row.sel { background: var(--accent-soft); }
.row.sel .name { color: var(--accent); font-weight: 600; }
.row .twisty { width: 16px; height: 16px; display: grid; place-items: center; color: var(--faint); flex: none; border: 0; background: none; padding: 0; }
.row .twisty svg { width: 10px; height: 10px; transition: transform 0.12s; }
.row .twisty.open svg { transform: rotate(90deg); }
.row .ico { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.row .ico svg { width: 15px; height: 15px; }
.row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .name input { width: 100%; height: 22px; border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; background: var(--raised); }
.row .eye { opacity: 0; border: 0; background: none; padding: 2px; color: var(--muted); display: grid; place-items: center; }
.row:hover .eye, .row .eye.off { opacity: 1; }
.row .eye svg { width: 14px; height: 14px; }
.row.hidden-obj .name { color: var(--faint); }
.row.drop-in { box-shadow: inset 0 0 0 1.5px var(--accent); }
.row.drop-before::before, .row.drop-after::after {
  content: ""; position: absolute; left: 8px; right: 6px; height: 2px; background: var(--accent); border-radius: 2px;
}
.row.drop-before::before { top: -1px; }
.row.drop-after::after { bottom: -1px; }
.ico-container { color: var(--accent); }
.ico-gui { color: var(--fg); }
.ico-mod { color: var(--scale); }
.ico-layout { color: var(--offset); }
.ico-root { color: var(--muted); }

/* stage */
.stage { grid-area: stage; }
.stagebar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; min-height: 40px; }
.stagebar select, .props select {
  height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); padding: 0 6px; max-width: 100%;
}
.stagebar .spacer { flex: 1; }
.zoomval { font: 500 12px/1 var(--font-mono); min-width: 44px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.canvas {
  flex: 1; min-height: 0; overflow: auto; position: relative; background-color: var(--stage);
  background-image: radial-gradient(var(--stage-dot) 1px, transparent 1.2px);
  background-size: 16px 16px; scrollbar-width: thin;
}
.canvas-inner { position: relative; margin: 0 auto; }
.device {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25), 0 12px 40px rgba(10, 14, 30, 0.28);
  border-radius: 4px; overflow: hidden;
}
.screen { position: absolute; inset: 0; overflow: hidden; }
.backdrop-game {
  background:
    radial-gradient(120% 60% at 30% 108%, #5d9c46 0 34%, transparent 34.5%),
    radial-gradient(90% 50% at 85% 112%, #4c8a3b 0 38%, transparent 38.5%),
    linear-gradient(#7ec3f2 0%, #b7e0fa 58%, #e3f3fd 100%);
}
.backdrop-checker {
  background-color: #f2f2f2;
  background-image: linear-gradient(45deg, #dcdcdc 25%, transparent 25%, transparent 75%, #dcdcdc 75%),
    linear-gradient(45deg, #dcdcdc 25%, transparent 25%, transparent 75%, #dcdcdc 75%);
  background-size: 24px 24px; background-position: 0 0, 12px 12px;
}
.backdrop-night { background: linear-gradient(#0d1424, #1b2741 70%, #24324f); }
.statusline {
  display: flex; gap: 14px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line-soft);
  font: 11.5px/1.2 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
}
.statusline .hint { margin-left: auto; font-family: var(--font-ui); color: var(--faint); overflow: hidden; text-overflow: ellipsis; }

/* rendered gui objects (the user's design; colors come from its own properties) */
.gui { position: absolute; box-sizing: border-box; }
.gui > .content { position: absolute; }
.gui > .txt { position: absolute; display: flex; pointer-events: none; overflow: visible; }
.gui > .txt > span { line-height: 1; white-space: pre; }
.gui > .txt.wrap > span { white-space: pre-wrap; overflow-wrap: anywhere; }
.gui > img.pic { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.gui .ph {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; overflow: hidden;
  background-image: repeating-linear-gradient(45deg, rgba(120, 128, 150, 0.22) 0 6px, rgba(120, 128, 150, 0.08) 6px 12px);
  color: rgba(40, 46, 66, 0.75); font: 600 11px/1.2 "JetBrains Mono", monospace; text-align: center;
}
.gui.scroller > .content { overflow: auto; }
.gui > .content > .canvasbox { position: absolute; left: 0; top: 0; }
.preview .gui.btnlike { cursor: pointer; }
.preview .gui.btnlike:hover { filter: brightness(0.9); }
.preview .gui.btnlike:active { filter: brightness(0.75); }
.gui > .txt > span[contenteditable] { outline: none; cursor: text; min-width: 2px; }
.gui > .txt > span[contenteditable]:empty::before { content: attr(data-ph); color: rgb(178, 178, 178); }

/* selection overlay */
.overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
.selbox { position: absolute; border: 1.5px solid var(--accent); pointer-events: none; }
.selbox.locked { border-style: dashed; }
.hoverbox { position: absolute; border: 1px solid var(--accent); opacity: 0.55; pointer-events: none; }
.handle {
  position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; background: #fff;
  border: 1.5px solid var(--accent); border-radius: 2px; pointer-events: auto;
}
.handle[data-h="n"], .handle[data-h="s"] { cursor: ns-resize; }
.handle[data-h="e"], .handle[data-h="w"] { cursor: ew-resize; }
.handle[data-h="ne"], .handle[data-h="sw"] { cursor: nesw-resize; }
.handle[data-h="nw"], .handle[data-h="se"] { cursor: nwse-resize; }
.anchor-dot {
  position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 2px #fff;
}
.guide { position: absolute; background: var(--guide); pointer-events: none; }
.guide.v { width: 1px; }
.guide.h { height: 1px; }
.readout {
  position: absolute; pointer-events: none; padding: 5px 7px; border-radius: 6px; white-space: nowrap;
  background: rgba(15, 18, 30, 0.9); color: #fff; font: 500 11px/1.35 "JetBrains Mono", monospace;
  font-variant-numeric: tabular-nums; z-index: 5;
}
.readout .s { color: #5FE0D0; }
.readout .o { color: #FFC07A; }
.readout .k { color: #A9B0C4; }

/* properties */
.props { grid-area: props; }
.tabs { display: flex; gap: 2px; }
.tabs button {
  border: 0; background: none; height: 26px; padding: 0 9px; border-radius: 6px;
  font: 600 11px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint);
}
.tabs button.on { color: var(--fg); background: var(--line-soft); }
.selhead { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 8px; }
.selhead .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.selhead .who svg { width: 18px; height: 18px; flex: none; }
.selhead .who b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selhead .who span { color: var(--faint); font-size: 12px; white-space: nowrap; }
.selhead .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.selhead .actions .btn { height: 26px; font-size: 12px; padding: 0 8px; }
.cat { border-bottom: 1px solid var(--line-soft); }
.cat > button {
  width: 100%; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 9px 12px 7px;
  font: 600 11px/1 var(--font-ui); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); text-align: left;
}
.cat > button svg { width: 10px; height: 10px; transition: transform 0.12s; }
.cat.open > button svg { transform: rotate(90deg); }
.cat .rows { display: none; padding: 0 10px 10px 12px; flex-direction: column; gap: 4px; }
.cat.open .rows { display: flex; }
.prow { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 28px; }
.prow > label { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow.sub > label { padding-left: 14px; }
.prow.dim { opacity: 0.5; }
.fld {
  height: 28px; width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--raised);
  padding: 0 7px; font: 12px/1 var(--font-mono); font-variant-numeric: tabular-nums;
}
.fld:hover { border-color: var(--faint); }
.fld:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.fld.bad { border-color: var(--danger); }
.fld.s { color: var(--scale); }
.fld.o { color: var(--offset); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.combo { display: flex; gap: 4px; align-items: center; min-width: 0; }
.combo .fld { flex: 1; }
.swatch {
  width: 28px; height: 28px; flex: none; border-radius: 6px; border: 1px solid var(--line); padding: 0; overflow: hidden; position: relative;
}
.swatch input { position: absolute; inset: -6px; width: 40px; height: 40px; border: 0; padding: 0; cursor: pointer; opacity: 0; }
.swatch span { position: absolute; inset: 0; }
.expand { border: 0; background: none; width: 20px; height: 28px; display: grid; place-items: center; color: var(--faint); flex: none; padding: 0; }
.expand svg { width: 10px; height: 10px; transition: transform 0.12s; }
.expand.open svg { transform: rotate(90deg); }
.slider { width: 100%; accent-color: var(--accent); }
.note { color: var(--faint); font-size: 12px; padding: 4px 0 2px; line-height: 1.45; }
.note code, .empty code { font-family: var(--font-mono); font-size: 11.5px; }
.empty { padding: 28px 18px; color: var(--muted); line-height: 1.55; }
.empty h3 { margin: 0 0 6px; color: var(--fg); font-size: 14px; }
.legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

/* code */
.codewrap { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.codebar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
pre.code {
  margin: 0; padding: 12px 14px 20px; font: 12px/1.55 var(--font-mono); white-space: pre; overflow: auto;
  flex: 1; min-height: 0; tab-size: 4; scrollbar-width: thin;
}
.code .kw { color: var(--accent); font-weight: 600; }
.code .st { color: var(--scale); }
.code .nu { color: var(--offset); }
.code .cm { color: var(--faint); font-style: italic; }

/* modal + menus + toast */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 20, 0.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal {
  width: min(860px, 100%); height: min(640px, 100%); background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
}
.modal header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.modal header h3 { margin: 0; font: 700 17px/1 var(--font-display); }
.modal header .spacer { flex: 1; }
.modal .how { padding: 10px 16px; color: var(--muted); border-bottom: 1px solid var(--line-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.modal .how p { margin: 0; flex: 1 1 260px; min-width: 0; }
.modal footer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line-soft); justify-content: flex-end; flex-wrap: wrap; }
.menu {
  position: fixed; z-index: 60; min-width: 220px; background: var(--raised); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 5px;
}
.menu button {
  width: 100%; display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 7px 9px;
  border-radius: 6px; text-align: left;
}
.menu button:hover { background: var(--accent-soft); }
.menu button:disabled { opacity: 0.4; background: none; cursor: default; }
.menu button svg { width: 16px; height: 16px; flex: none; }
.menu button small { margin-left: auto; color: var(--faint); font-size: 11px; }
.menu hr { border: 0; border-top: 1px solid var(--line-soft); margin: 4px 2px; }
.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 70;
  background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow);
  font-weight: 500; max-width: calc(100% - 32px);
}

/* narrow screens: the viewport fills the screen, Explorer and Properties open as sheets */
@media (max-width: 920px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "ribbon" "stage"; }
  .narrow-only { display: inline-flex !important; }
  .wide-only { display: none !important; }
  .explorer, .props {
    position: fixed; z-index: 40; top: 10px; bottom: 10px; width: min(340px, calc(100% - 32px));
    box-shadow: var(--shadow); display: none;
  }
  .explorer { left: 16px; }
  .props { right: 16px; }
  .explorer.sheet-open, .props.sheet-open { display: flex; }
}
@media (max-width: 560px) {
  .bar { gap: 6px; }
  .bar .lbl, .wordmark b { display: none; }
  .bar .btn { padding: 0 8px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
