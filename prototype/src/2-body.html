<div class="app" id="app">
  <header class="bar">
    <div class="wordmark">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6.5" fill="var(--accent)"/><rect x="7" y="7" width="12" height="12" rx="2.5" fill="none" stroke="var(--on-accent)" stroke-width="2"/><circle cx="13" cy="13" r="2.3" fill="var(--on-accent)"/><path d="M19 13h4M13 19v4" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"/></svg>
      <b>Framecraft</b><span class="chip wide-only">Prototype</span>
    </div>
    <button class="btn" id="btnFile" aria-haspopup="menu"><span data-icon="file"></span><span class="lbl">Project</span></button>
    <div class="spacer"></div>
    <div class="group">
      <button class="btn icon" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><span data-icon="undo"></span></button>
      <button class="btn icon" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><span data-icon="redo"></span></button>
    </div>
    <button class="btn narrow-only" id="btnShowExplorer" aria-label="Explorer"><span data-icon="tree"></span><span class="lbl">Explorer</span></button>
    <button class="btn narrow-only" id="btnShowProps" aria-label="Properties"><span data-icon="sliders"></span><span class="lbl">Properties</span></button>
    <button class="btn" id="btnPreview" title="Try the UI: buttons react, text boxes take input (P)"><span data-icon="play"></span><span class="wide-only">Preview</span></button>
    <button class="btn primary" id="btnExport"><span data-icon="export"></span><span class="lbl">Export</span></button>
  </header>

  <nav class="ribbon panel" id="ribbon" aria-label="Insert and edit tools">
    <div class="rgroup"><div class="items" id="insertObjects"></div><div class="label">Insert object</div></div>
    <div class="rgroup"><div class="items" id="insertMods"></div><div class="label">Add modifier to selection</div></div>
    <div class="rgroup">
      <div class="items">
        <div class="stack">
          <div class="seg" id="unitSeg" role="group" aria-label="Units that dragging edits">
            <button data-u="auto" title="Keep whatever unit each value already uses">Auto</button>
            <button data-u="scale" title="Dragging writes Scale (fraction of parent)">Scale</button>
            <button data-u="offset" title="Dragging writes Offset (pixels)">Offset</button>
          </div>
          <label class="toggle"><input type="checkbox" id="snapToggle" checked> Smart snapping <span class="wide-only">(hold Alt to skip)</span></label>
        </div>
      </div>
      <div class="label">Dragging edits</div>
    </div>
    <div class="rgroup">
      <div class="items">
        <button class="tool" id="toScale" title="Rewrite Position and Size of the selection and its children as Scale"><span data-icon="toScale"></span>To Scale</button>
        <button class="tool" id="toOffset" title="Rewrite Position and Size of the selection and its children as Offset"><span data-icon="toOffset"></span>To Offset</button>
      </div>
      <div class="label">Convert units</div>
    </div>
  </nav>

  <aside class="explorer panel" id="explorer" aria-label="Explorer">
    <div class="phead"><h2>Explorer</h2><div class="spacer"></div><button class="btn icon narrow-only" data-close="explorer" aria-label="Close Explorer">✕</button></div>
    <div class="pbody"><div class="tree" id="tree" role="tree" aria-label="Instance tree"></div></div>
  </aside>

  <main class="stage panel" aria-label="Viewport">
    <div class="stagebar">
      <select id="deviceSel" aria-label="Device size"></select>
      <select id="backdropSel" aria-label="Backdrop">
        <option value="game">Game scene</option>
        <option value="night">Night scene</option>
        <option value="checker">Checker</option>
      </select>
      <div class="spacer"></div>
      <div class="legend wide-only" aria-hidden="true"><span><i style="background:var(--scale)"></i>Scale</span><span><i style="background:var(--offset)"></i>Offset</span></div>
      <button class="btn icon" id="zoomOut" aria-label="Zoom out">−</button>
      <span class="zoomval" id="zoomVal">100%</span>
      <button class="btn icon" id="zoomIn" aria-label="Zoom in">+</button>
      <button class="btn" id="zoomFit">Fit</button>
    </div>
    <div class="canvas" id="canvas">
      <div class="canvas-inner" id="canvasInner">
        <div class="device" id="device"><div class="screen backdrop-game" id="screen"></div></div>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
    <div class="statusline" id="status"></div>
  </main>

  <aside class="props panel" id="props" aria-label="Properties">
    <div class="phead">
      <div class="tabs" role="tablist">
        <button class="on" data-tab="props" role="tab">Properties</button>
        <button data-tab="code" role="tab">Code</button>
      </div>
      <div class="spacer"></div>
      <button class="btn icon narrow-only" data-close="props" aria-label="Close Properties">✕</button>
    </div>
    <div class="pbody" id="propsBody"></div>
    <div class="codewrap" id="codePane" hidden></div>
  </aside>
</div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<input type="file" id="imageInput" accept="image/*" hidden>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>
